[project]
name = "tradingengine"
version = "0.1.0"
description = "TradingEngine – Engine (Marktdaten, Analyse, Signale). Kein Orderweg in dieser Etappe."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
tradingengine = "tradingengine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradingengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["pg: braucht eine Postgres-Datenbank (TE_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
